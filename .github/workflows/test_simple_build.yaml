name: test-simple-build

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev'

jobs:
  # 简单测试构建 - 只测试Android APK
  test-android-build:
    runs-on: ubuntu-latest
    
    steps:
      # 签出代码
      - uses: actions/checkout@v4
        with:
          ref: dev

      # 设置JAVA环境
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: "17"
          cache: "gradle"

      # 设置Flutter
      - name: Flutter action
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          cache: true 

      # 调试信息
      - name: Flutter Doctor
        run: flutter doctor -v

      # 检查项目结构
      - name: Check project structure
        run: |
          echo "=== Project structure ==="
          ls -la
          echo "=== simple_live_core ==="
          ls -la simple_live_core/
          echo "=== simple_live_app ==="
          ls -la simple_live_app/

      # 更新tars_dart依赖
      - name: Restore packages for tars_dart
        run: |
          cd simple_live_core/packages/tars_dart
          flutter pub get

      # 更新core依赖
      - name: Restore packages for core
        run: |
          cd simple_live_core
          flutter pub get

      # 更新app依赖
      - name: Restore packages for app
        run: |
          cd simple_live_app
          flutter pub get

      # 测试基本构建
      - name: Test Flutter Build (Android Debug)
        run: |
          cd simple_live_app
          flutter build apk --debug --verbose

      # 上传构建产物
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
